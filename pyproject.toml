[project]
name = "flowpilot"
version = "1.0.0"
description = "Schedules business-contact calls from Word/PDF documents into Google Calendar"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
